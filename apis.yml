name: Cultivate
description: Cultivate was an AI-powered digital leadership and coaching platform that analyzed
  leaders' own opt-in digital communication data to deliver hyper-personalized, privacy-preserving
  coaching insights and recommendations for people managers. Founded through an Entrepreneur in
  Residence program at Samsung NEXT by Joseph Freed, Samir Meghani, and Andy Horng, and backed by
  Trinity Ventures, Silicon Valley Data Capital, and Bloomberg Beta, Cultivate was acquired by employee
  listening and people-analytics company Perceptyx on February 15, 2022, where it became the basis for
  Perceptyx's "Cultivate Intelligent Coaching" product. Cultivate operated as an enterprise HR/leadership
  SaaS and did not publish a public developer API or OpenAPI. This profile is retained as a
  portfolio-lead record; the company no longer exists as an independent entity.
